[package]
name = "discord-proxy"
version = "0.1.0"
description = "Route every Discord connection through the proxy you pick"
edition = "2021"

[lib]
name = "discord_proxy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
